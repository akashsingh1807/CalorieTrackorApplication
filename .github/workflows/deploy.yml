name: CI/CD Pipeline to Google Cloud Run

on:
  push:
    branches:
      - master
      - main

jobs:
  build-test-and-deploy:
    name: Build, Test, and Deploy to Cloud Run
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      # 1. Build without Tests (tests require local Postgres database)
      - name: Build with Maven
        working-directory: ./backend
        run: ./mvnw clean package -DskipTests

      # 2. Authenticate to Google Cloud
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.GCP_CREDENTIALS }}'

      # 3. Setup Google Cloud SDK
      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      # 4. Configure Docker for Google Container Registry
      - name: Configure Docker
        run: gcloud auth configure-docker gcr.io --quiet

      # 5. Build Docker Image
      - name: Build Docker Image
        working-directory: ./backend
        run: docker build -t gcr.io/${{ secrets.GCP_PROJECT_ID }}/calorie-tracker-backend .

      # 6. Push Docker Image
      - name: Push Docker Image
        run: docker push gcr.io/${{ secrets.GCP_PROJECT_ID }}/calorie-tracker-backend

      # 7. Deploy Backend to Google Cloud Run
      - name: Deploy Backend to Cloud Run
        id: deploy-backend
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: calorie-tracker-backend
          image: gcr.io/${{ secrets.GCP_PROJECT_ID }}/calorie-tracker-backend
          region: us-central1
          flags: '--allow-unauthenticated'
          env_vars: |
            GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}
            SPRING_DATASOURCE_URL=${{ secrets.SPRING_DATASOURCE_URL }}
            SPRING_DATASOURCE_USERNAME=${{ secrets.SPRING_DATASOURCE_USERNAME }}
            SPRING_DATASOURCE_PASSWORD=${{ secrets.SPRING_DATASOURCE_PASSWORD }}
            JWT_SECRET=${{ secrets.JWT_SECRET }}

      # 8. Build Frontend Docker Image
      - name: Build Frontend Docker Image
        working-directory: ./frontend
        run: |
          docker build \
            --build-arg NEXT_PUBLIC_API_URL=${{ steps.deploy-backend.outputs.url }} \
            -t gcr.io/${{ secrets.GCP_PROJECT_ID }}/calorie-tracker-frontend .

      # 9. Push Frontend Docker Image
      - name: Push Frontend Docker Image
        run: docker push gcr.io/${{ secrets.GCP_PROJECT_ID }}/calorie-tracker-frontend

      # 10. Deploy Frontend to Google Cloud Run
      - name: Deploy Frontend to Cloud Run
        id: deploy-frontend
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: calorie-tracker-frontend
          image: gcr.io/${{ secrets.GCP_PROJECT_ID }}/calorie-tracker-frontend
          region: us-central1
          flags: '--allow-unauthenticated'
          env_vars: |
            NEXT_PUBLIC_API_URL=${{ steps.deploy-backend.outputs.url }}

